[core]
plugins = autostart

[autostart]
keyboard = sh -c 'for i in 1 2 3 4 5; do wvkbd-mobintl -L 200 --hidden && break; sleep 1; done'
toggle = sh -c 'for i in 1 2 3 4 5; do kbd-toggle && break; sleep 1; done'
browser = chromium --accept-lang=de-DE,de --ozone-platform=wayland --no-memcheck --noerrdialogs --check-for-update-interval=31536000 --disable-infobars --disable-features=IsolateOrigins,site-per-process,BackForwardCache --renderer-process-limit=1 --disable-sync --disable-extensions --disable-component-update --disable-default-apps --kiosk $KIOSK_URL
