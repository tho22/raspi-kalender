name: Build kiosk image

# Manual trigger only (no push/PR trigger): this build takes 45-90+ minutes
# under QEMU emulation and isn't meant to run on every commit.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag for the built image (default: build-<date>-<run number>)"
        required: false
        type: string
      keep_releases:
        description: "Number of most-recent releases to keep (older ones are deleted after a successful build)"
        required: false
        type: number
        default: 3

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Generous ceiling, not an expected duration: fail fast instead of
    # hanging silently (a broken apt mirror once hung a local build here
    # for ~70 hours before anyone noticed).
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - name: Install QEMU user-mode emulation (for the armhf build)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support

      - name: Set up pi-gen (apply patch, copy stage-kalender/config)
        run: ./setup.sh

      # pi-gen's own "work" directory holds each stage's rootfs. Normally
      # this lives in an anonymous Docker volume (gone once the job's VM is
      # torn down), so every run would re-debootstrap and re-install every
      # package from stage0-stage2 from scratch (~10-40 of the ~45-90 min
      # total). Bind-mounting it to a path on the runner instead lets us
      # cache it across runs: pi-gen's own prerun.sh already skips
      # debootstrap/re-copying a stage if its rootfs dir already exists, so
      # a cache hit mostly just re-verifies already-installed packages.
      - name: Restore pi-gen work cache
        uses: actions/cache@v4
        with:
          path: pi-gen-work-cache
          key: pigen-work-${{ github.run_id }}
          restore-keys: |
            pigen-work-

      - name: Build image
        env:
          PIGEN_DOCKER_OPTS: "--mount type=bind,source=${{ github.workspace }}/pi-gen-work-cache,target=/pi-gen/work"
        run: |
          mkdir -p pi-gen-work-cache
          cd pi-gen
          ./build-docker.sh

      # export-image is fully regenerated every run (it's what we're
      # actually building), so caching it buys nothing and would just waste
      # cache storage. The build container runs as root, so its files are
      # root-owned on the runner too; actions/cache's implicit save at the
      # end of the job needs to read them, hence the chown. Device nodes
      # (rootfs/dev/null etc., created by debootstrap) can't be restored by
      # actions/cache's unprivileged tar (mknod needs root) and make the
      # whole restore fail; they're also never actually needed from the
      # cache since pi-gen's on_chroot always bind-mounts the real /dev over
      # a stage's rootfs/dev before using it -- so just drop them.
      - name: Trim and prepare work cache for saving
        if: always()
        run: |
          sudo rm -rf pi-gen-work-cache/*/export-image pi-gen-work-cache/build.log
          sudo find pi-gen-work-cache -depth \( -type c -o -type b \) -delete
          sudo chown -R "$(id -u):$(id -g)" pi-gen-work-cache

      - name: Determine release tag
        id: tag
        run: |
          tag="${{ github.event.inputs.release_tag }}"
          if [ -z "$tag" ]; then
            tag="build-$(date +%Y-%m-%d)-${{ github.run_number }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # pi-gen names the raw image after the build date alone (e.g.
      # "2026-10-10-kalender.img"), so multiple runs on the same day would
      # otherwise all produce an identically-named download -- include the
      # release tag (which is already unique per run) in the asset's own
      # filename too, not just in the release metadata, so downloaded files
      # stay distinguishable on disk.
      - name: Compress image
        id: compress
        run: |
          cd pi-gen/deploy
          img="$(ls -- *.img)"
          xz -T0 -6 -k "$img"
          renamed="kalender-${{ steps.tag.outputs.tag }}.img.xz"
          mv "${img}.xz" "$renamed"
          echo "xz_path=pi-gen/deploy/${renamed}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            "${{ steps.compress.outputs.xz_path }}" \
            --title "Kalender-Pi image ${{ steps.tag.outputs.tag }}" \
            --notes "Automated build via GitHub Actions (manual trigger). Decompress with: xz -d *.img.xz"

      - name: Delete old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keep="${{ github.event.inputs.keep_releases }}"
          keep="${keep:-3}"
          gh release list --limit 100 --json tagName,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[${keep}:] | .[].tagName" \
            | while read -r old_tag; do
                echo "Deleting old release: ${old_tag}"
                gh release delete "${old_tag}" --yes --cleanup-tag
              done
